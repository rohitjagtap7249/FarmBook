
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.rohitjagtap --project-name agri_spray_offline .

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android SDK and notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Configure app Gradle file
          gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          s, n = re.subn(
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 35',
              s
          )
          if n == 0:
              s, n = re.subn(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 35',
                  s
              )

          if n == 0 and not re.search(r'compileSdk(?:Version)?\s*[=( ]\s*35', s):
              raise SystemExit("Could not configure compileSdk")

          # Enable Java desugaring
          if "coreLibraryDesugaringEnabled" not in s:
              s, n = re.subn(
                  r'compileOptions\s*\{',
                  'compileOptions {\n        coreLibraryDesugaringEnabled true',
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("compileOptions block not found")

          # Add desugaring dependency
          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      1
                  )
              else:
                  s += """
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          """

          gradle.write_text(s)

          # Configure Android manifest
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          x = manifest.read_text()

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.VIBRATE",
          ]

          for permission in permissions:
              if permission not in x:
                  x = x.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}"/>\n    <application',
                      1
                  )

          receivers = """
              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                  android:exported="false" />

              <receiver
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                  android:exported="false">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          """

          if "ScheduledNotificationReceiver" not in x:
              x = x.replace("</application>", receivers + "\n</application>", 1)

          x = re.sub(
              r'android:label="[^"]*"',
              'android:label="FarmBook"',
              x,
              count=1
          )

          manifest.write_text(x)
          print("Android configuration completed")
          PY

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Release signing secrets are missing."
            echo "Configure your GitHub signing secrets before building."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t"' | base64 -d > android/app/farmbook.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=farmbook.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "keystoreProperties" not in s:
              loader = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
              s, n = re.subn(r'(?m)^android\s*\{', loader + 'android {', s, count=1)
              if n != 1:
                  raise SystemExit("android block not found")

              signing = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """
              s, n = re.subn(
                  r'(?m)^(\s*)buildTypes\s*\{',
                  lambda m: signing + m.group(0),
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit("buildTypes block not found")

              s, n = re.subn(
                  r'signingConfig\s*=?\s*signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  s
              )
              if n == 0:
                  raise SystemExit("Could not set release signing")

              p.write_text(s)

          print("Release signing configured")
          PY

      - name: Verify project files
        run: |
          test -f lib/main.dart
          test -f lib/tasks_ui.dart
          test -f lib/notifications.dart
          test -f android/app/src/main/AndroidManifest.xml
          echo "Project files verified"

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK signing fingerprint
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1|SHA256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farmbook-release-apk
          path: build/app/outputs/flutter-apk/*.apk
