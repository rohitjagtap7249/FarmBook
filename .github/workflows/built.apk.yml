name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.rohitjagtap --project-name agri_spray_offline .

      - name: Fix default widget test
        run: |
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:agri_spray_offline/main.dart';

          void main() {
            testWidgets('App builds and shows home page', (WidgetTester tester) async {
              await tester.pumpWidget(const AgriSprayOfflineApp());
              expect(find.byType(AgriSprayOfflineApp), findsOneWidget);
            });
          }
          EOF

      - name: Set Android SDK 35
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          if grep -q "compileSdk = 35" android/app/build.gradle; then
            echo "compileSdk successfully set to 35"
          else
            echo "ERROR: compileSdk was not set to 35"
            exit 1
          fi

      - name: Configure Android for notifications
        run: |
          python3 - <<'PY'
          import re
          g = 'android/app/build.gradle'
          s = open(g).read()
          if 'coreLibraryDesugaringEnabled' not in s:
              s, n = re.subn(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled = true', s, count=1)
              if n != 1:
                  raise SystemExit('compileOptions block not found in build.gradle')
          if 'desugar_jdk_libs' not in s:
              s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          open(g, 'w').write(s)

          m = 'android/app/src/main/AndroidManifest.xml'
          x = open(m).read()
          perms = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
              '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
          )
          if 'POST_NOTIFICATIONS' not in x:
              x = x.replace('<application', perms + '    <application', 1)
          receivers = (
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
              '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
              '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
              '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
              '            </intent-filter>\n'
              '        </receiver>\n'
          )
          if 'ScheduledNotificationReceiver' not in x:
              x = x.replace('</application>', receivers + '    </application>', 1)
          open(m, 'w').write(x)
          print('Android notification setup done')
          PY

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "WARNING: signing secrets not found. Using a temporary debug key."
            echo "An APK built this way will NOT install over a previous build."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t"' > /tmp/ks.b64
          echo "Secret length: $(wc -c < /tmp/ks.b64) characters (expected 3644)"
          base64 -d /tmp/ks.b64 > android/app/farmbook.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=farmbook.jks"
          } > android/key.properties
          python3 - <<'PY'
          import re
          g = 'android/app/build.gradle'
          s = open(g).read()
          if 'keystoreProperties' not in s:
              loader = (
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              s, n = re.subn(r'(?m)^android\s*\{', lambda m: loader + 'android {', s, count=1)
              if n != 1:
                  raise SystemExit('android block not found')
              signing = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile file(keystoreProperties['storeFile'])\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "        }\n"
                  "    }\n\n"
              )
              s, n = re.subn(r'(?m)^(\s*)buildTypes\s*\{', lambda m: signing + m.group(0), s, count=1)
              if n != 1:
                  raise SystemExit('buildTypes block not found')
              s, n = re.subn(r'signingConfig\s*=?\s*signingConfigs\.debug', 'signingConfig signingConfigs.release', s)
              if n < 1:
                  raise SystemExit('release signingConfig line not found')
              open(g, 'w').write(s)
          print('Release signing configured')
          PY

      - name: Disable code shrinking (needed for notifications)
        run: |
          python3 - <<'PY'
          import re
          g = 'android/app/build.gradle'
          s = open(g).read()
          if 'minifyEnabled' not in s:
              s, n = re.subn(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            minifyEnabled false\n            shrinkResources false',
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('release block not found')
              open(g, 'w').write(s)
          open('android/app/proguard-rules.pro', 'w').write(
              '-keep class com.dexterous.** { *; }\n'
              '-keepattributes Signature\n'
              '-keepattributes *Annotation*\n'
              '-keep class com.google.gson.reflect.TypeToken { *; }\n'
              '-keep class * extends com.google.gson.reflect.TypeToken\n'
          )
          print('Code shrinking disabled')
          PY

      - name: Create FarmBook app icons
        run: |
          python3 -m pip install --quiet pillow
          python3 make_icons.py android/app/src/main/res
          ls android/app/src/main/res/mipmap-xxxhdpi

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="FarmBook"/' android/app/src/main/AndroidManifest.xml

      - name: Verify refactored files
        run: |
          echo "Checking refactored Dart files..."

          test -f lib/main.dart
          test -f lib/models.dart
          test -f lib/database.dart
          test -f lib/helpers.dart
          test -f lib/pages.dart
          test -f lib/tasks_ui.dart
          test -f lib/magic_engine.dart
          test -f lib/stock_data.dart
          test -f lib/cloud_backup.dart
          test -f lib/share_export.dart

          if grep -q "class SelectedDripChemical" lib/models.dart; then
            echo "SelectedDripChemical FOUND in models.dart"
          else
            echo "ERROR: SelectedDripChemical is missing from models.dart"
            exit 1
          fi

          echo "All refactored files verified successfully."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Show APK signing fingerprint (SHA-1)
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA1|SHA256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agri-spray-release-apk
          path: build/app/outputs/flutter-apk/*.apk
